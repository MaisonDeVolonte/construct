# ========================================================
# @file ci.yml - syntax, lint, validation, and drift gates
# ========================================================
# @description
# - the required check `gh pr merge --auto` waits on
# @see README.md, plugins/gitgud/skills/deliver/SKILL.md

name: ci

on:
  # repo requires pull requests before merging
  pull_request:
    branches: [main]
  # repo has no merge queue so ci has to run on push too
  push:
    branches: [main]

permissions:
  # the only permission ci needs is 'read' because the 'verify' job only lints and checks
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # gates only read file state, so checkout only needs latest commit
      - uses: actions/checkout@v4

      # scripts are nested so we use git to list the files (globs only reach one level down)
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0r shellcheck -x --severity=warning

      # shell syntax fallback just in case shellcheck isn't able to parse a file
      - name: syntax
        run: git ls-files -z '*.sh' | xargs -0rn1 bash -n

      # ensures every skill has a matching bash sidecar and a branch for every sidecar outcome
      - name: validate-skills
        run: bash .claude/skills/validate-skills/validate-skills.sh --strict --quick

      # each sidecar must parse and answer --help/--test, refusing unknown flags and broken refs
      - name: test-skills
        run: bash .claude/skills/test-skills/test-skills.sh --strict --quick

      # ensures all readme files are in sync
      - name: export-readme
        run: bash .claude/skills/export-readme/export-readme.sh --strict --quick

      # ensures the marketplace manifest and all plugin manifests have matching version numbers
      - name: push-release
        run: bash .claude/skills/push-release/push-release.sh --strict --quick

      # ensures hooks use valid json with resolving paths and correctly typed matchers (breaks file)
      - name: operator:hooks
        run: bash plugins/operator/skills/hooks/hooks.sh --strict --quick

      # lints file names, wayfinders, and comments; --warn only
      - name: retardify:file
        run: bash plugins/retardify/skills/file/file.sh --warn --quick

      # lints code names, structure, and inline-comments; --warn only
      - name: retardify:code
        run: git ls-files -z '*.sh' | xargs -0rn1 bash plugins/retardify/skills/code/code.sh --warn --quick
