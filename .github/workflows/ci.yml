# =========================================
# @file ci.yml - shell lint and syntax gate
# =========================================
# @description
# - the repo ships shell scripts that source each other, so ci gates exactly that and no more
# - `shellcheck -x` lints every sidecar, hook, and validator at warning severity, sourced files too
# - the shared files are linted directly as well, so a renamed variable fails the build (SC2034)
# - references are NOT gated here: `git-insights.sh` ranks opportunities, it never graded them
# - a report shaped for judgement makes a poor required check, so its replacement is its own tool
# - until that checker lands nothing gates references, and a broken `@see` reaches main unblocked
# - this is the required check that lets `gh pr merge --auto` engage (see AGENTS/skills/git-deliver/SKILL.md)
# @see AGENTS.md, AGENTS/skills/git-deliver/SKILL.md, AGENTS/skills/check-wayfinders/SKILL.md

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships preinstalled on ubuntu-latest runners
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning AGENTS/hooks/*.sh AGENTS/settings/*.sh AGENTS/shared/*.sh AGENTS/skills/*/*.sh

      # every script must at least parse, including any the lint globs above miss
      - name: syntax
        run: |
          find AGENTS -name '*.sh' -print0 | xargs -0 -n1 bash -n
